<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candidatos - Eleições 2026 - MG</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="cabecalho">
    <h1>Candidatos - Eleições 2026 - MG</h1>
</header>

<main class="container">
    <form method="get" th:action="@{/}" class="filtros">
        <div class="campo">
            <label for="texto">Buscar por nome / número</label>
            <input id="texto"
                   type="text"
                   name="texto"
                   placeholder="Ex: Ana, 1240..."
                   th:value="${textoSelecionado}">
        </div>

        <div class="campo">
            <label for="cargo">Cargo</label>
            <select id="cargo" name="cargo">
                <option value="" th:selected="${cargoSelecionado == ''}">Todos</option>
                <option th:each="item : ${cargos}"
                        th:value="${item}"
                        th:text="${item}"
                        th:selected="${item == cargoSelecionado}">
                </option>
            </select>
        </div>

        <div class="campo">
            <label for="partido">Partido</label>
            <select id="partido" name="partido">
                <option value="" th:selected="${partidoSelecionado == ''}">Todos</option>
                <option th:each="item : ${partidos}"
                        th:value="${item}"
                        th:text="${item}"
                        th:selected="${item == partidoSelecionado}">
                </option>
            </select>
        </div>

        <button type="submit">Filtrar</button>
        <a th:href="@{/}" class="limpar">Limpar</a>
    </form>

    <p class="contador" th:text="${total} + ' candidato(s) encontrado(s).'">0 candidato(s) encontrado(s).</p>

    <p class="sem-resultados" th:if="${total == 0}">Nenhum candidato encontrado.</p>

    <section class="grade-candidatos" th:if="${total > 0}">
        <div class="card" th:each="cand : ${candidatos}">
            <div class="foto-wrapper">
                <img th:src="@{'/images/candidatos/' + ${cand.nomeArquivoFoto}}"
                     th:alt="${cand.nomeUrna}"
                     class="foto-candidato">
                <div class="sem-foto">Sem foto</div>
            </div>

            <div class="dados">
                <h2 th:text="${cand.nomeUrna}">NOME DE URNA</h2>

                <p><strong>Número:</strong> <span th:text="${cand.nrCandidato}">0000</span></p>
                <p class="cargo" th:text="${cand.cargo}">CARGO</p>
                <p th:if="${cand.siglaPartido != null and !cand.siglaPartido.isBlank()}"
                   th:text="${cand.siglaPartido + ' - ' + cand.nomePartido}">PARTIDO</p>
                <p th:if="${cand.uf != null and !cand.uf.isBlank()}"
                   th:text="${cand.uf}">UF</p>

                <p th:if="${cand.situacaoCandidatura != null and !cand.situacaoCandidatura.isBlank() and !cand.situacaoCandidatura.startsWith('#')}"
                   th:text="${cand.situacaoCandidatura}">SITUAÇÃO</p>

                <p th:if="${cand.idade >= 0}" th:text="${cand.idade + ' anos'}">00 anos</p>
                <p th:if="${cand.ocupacao != null and !cand.ocupacao.isBlank() and !cand.ocupacao.startsWith('#')}"
                   th:text="${cand.ocupacao}">OCUPAÇÃO</p>
                <p th:if="${cand.grauInstrucao != null and !cand.grauInstrucao.isBlank() and !cand.grauInstrucao.startsWith('#')}"
                   th:text="${cand.grauInstrucao}">ESCOLARIDADE</p>

                <p class="nome-civil" th:if="${cand.nomeCandidato != null and !cand.nomeCandidato.isBlank()}"
                   th:text="${cand.nomeCandidato}">NOME CIVIL</p>
            </div>
        </div>
    </section>
</main>

<script>
    document.querySelectorAll('.foto-candidato').forEach(function (img) {
        img.addEventListener('error', function () {
            img.style.display = 'none';
            if (img.nextElementSibling) {
                img.nextElementSibling.style.display = 'flex';
            }
        });
    });
</script>
</body>
</html>
